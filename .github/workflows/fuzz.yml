name: Fuzz parser

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fuzz.yml
      - grammar.js
      - src/parser.c
      - src/scanner.c
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/fuzz.yml
      - grammar.js
      - src/parser.c
      - src/scanner.c
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266
