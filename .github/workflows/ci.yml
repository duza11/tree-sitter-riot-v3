name: CI

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/ci.yml
      - grammar.js
      - src/**
      - test/**
      - examples/**/*.tag
      - queries/**
      - bindings/**
      - binding.gyp
      - tree-sitter.json
      - package.json
      - Cargo.toml
      - go.mod
      - pyproject.toml
      - Package.swift
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/ci.yml
      - grammar.js
      - src/**
      - test/**
      - examples/**/*.tag
      - queries/**
      - bindings/**
      - binding.gyp
      - tree-sitter.json
      - package.json
      - Cargo.toml
      - go.mod
      - pyproject.toml
      - Package.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086
        with:
          tree-sitter-ref: v0.26.9
      - name: Run tests
        uses: tree-sitter/parser-test-action@05f6ce7c7e54603c45cd87ed926725dc870bcc63
        with:
          abi-version: 14
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          test-swift: true
      - name: Parse examples
        uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521
        with:
          files: examples/*.tag
      - name: Validate queries
        if: runner.os == 'Linux'
        run: |
          tree-sitter query -q -p . queries/riot_v3/highlights.scm examples/basic.tag
          tree-sitter query -q -p . queries/riot_v3/injections.scm examples/basic.tag
          tree-sitter query -q -p . queries/riot_v3/folds.scm examples/basic.tag
