name: Lint

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/lint.yml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/lint.yml
      - eslint.config.mjs
      - grammar.js
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: npm
          node-version: 22
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
